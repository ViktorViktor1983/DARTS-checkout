name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Verify keystore exists
        run: |
          if [ ! -f keystore/debug.keystore ]; then
            echo "ERROR: keystore/debug.keystore not found in repository!"
            exit 1
          fi
          echo "Keystore found. Checking signature:"
          keytool -list -v -keystore keystore/debug.keystore \
            -storepass android -alias androiddebugkey | grep -i "SHA1" || true

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Show APK signature
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          echo "Signing info of $APK:"
          keytool -printcert -jarfile $APK 2>/dev/null | grep -i "SHA1" || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
